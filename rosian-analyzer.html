<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロシア語文法アナライザー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
        .highlight-relation {
            background-color: rgba(22, 163, 74, 0.4); /* green-600 with opacity */
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }
        .word-display {
            transition: background-color 0.2s ease-in-out;
            padding: 8px 12px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-6xl mx-auto">
        <div class="bg-gray-800 rounded-2xl shadow-2xl p-8">
            <header class="text-center mb-8">
                <h1 class="text-4xl font-bold text-cyan-400">ロシア語文法アナライザー</h1>
                <p class="text-gray-400 mt-2">ロシア語の文章を入力して、文法構造を視覚的に理解しましょう。</p>
                <a href="https://tunosuke.sakura.ne.jp/article.html?id=f4qfren7x3f" class="item_list_link">
                    <span class="nav_text">【ブログ】ロシア語の文法(特に語形変化)を理解しようとこころみた話<br></span>
                </a>
            </header>

            <main>
                <div class="mb-6">
                    <label for="russian-text" class="block mb-2 text-sm font-medium text-gray-300">ロシア語の文章を入力してください</label>
                    <textarea id="russian-text" rows="3" class="bg-gray-700 border border-gray-600 text-white text-lg rounded-lg focus:ring-cyan-500 focus:border-cyan-500 block w-full p-4 placeholder-gray-400" placeholder="例: Красивая девушка читает интересную книгу."></textarea>
                </div>
                
                <div class="text-center">
                    <button id="analyze-button" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300 ease-in-out transform hover:scale-105">
                        分析する
                    </button>
                </div>

                <div id="analysis-display" class="mt-10 p-6 bg-gray-900/50 rounded-lg min-h-[200px] overflow-x-auto">
                    <p class="text-gray-500 text-center">ここに分析結果が表示されます。</p>
                </div>
            </main>
        </div>
        <footer class="text-center mt-6 text-gray-500 text-sm">
            <a href="https://tunosuke.sakura.ne.jp/article.html?id=f4qfren7x3f" class="item_list_link">
                    <span class="nav_text">【ブログ】ロシア語の文法(特に語形変化)を理解しようとこころみた話<br></span>
            </a>
            <br>
            <p>&copy; 2026 Tze. All Rights Reserved. / Powered by Gemini.</p>
        </footer>
    </div>

    <script>
        const posColors = {
            "名詞": "border-blue-500",
            "形容詞": "border-green-500",
            "動詞": "border-red-500",
            "代名詞": "border-purple-500",
            "前置詞": "border-gray-400",
            "副詞": "border-yellow-500",
            "接続詞": "border-indigo-500",
            "不明": "border-gray-500"
        };

        const analyzeButton = document.getElementById('analyze-button');
        const russianText = document.getElementById('russian-text');
        const analysisDisplay = document.getElementById('analysis-display');

        // HTMLエスケープ処理によるセキュリティ対策(XSS防止)
        function escapeHTML(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/[&<>'"]/g, match => {
                const escapeMap = { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' };
                return escapeMap[match];
            });
        }

        async function fetchSentenceAnalysis(sentence) {
            // セキュリティ対策のため、Gemini APIキーを秘匿できるサーバーサイドのプログラム(PHP)を呼び出します。
            const apiUrl = './analyze.php'; 
            
            // 解析したい文章データのみをバックエンドに送信します
            const payload = { sentence: sentence };

            try {
                let response;
                // 指数バックオフによるリトライ実装
                for (let i = 0; i < 5; i++) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) break;
                    const waitTime = Math.pow(2, i) * 1000;
                    await new Promise(res => setTimeout(res, waitTime));
                }

                if (!response || !response.ok) {
                    const errorMsg = response ? await response.text() : "Request failed";
                    const statusCode = response ? response.status : "Unknown";
                    console.error("API Error Response:", errorMsg);
                    return { status: 'api_error', message: `HTTPステータス: ${statusCode}, 詳細: ${errorMsg}`, data: null };
                }

                const result = await response.json();
                const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (textResponse) {
                    try {
                        // responseMimeType: "application/json" を指定しているため、直接パース可能
                        const jsonData = JSON.parse(textResponse);
                        return { status: 'success', data: jsonData };
                    } catch (e) {
                        // フォールバック: 文字列からJSON部分を抽出
                        const jsonMatch = textResponse.match(/\[[\s\S]*\]/);
                        if (jsonMatch) {
                            const jsonData = JSON.parse(jsonMatch[0]);
                            return { status: 'success', data: jsonData };
                        }
                        return { status: 'parse_error', message: 'APIからの応答を解析できませんでした。', data: null };
                    }
                }
                return { status: 'not_found', message: 'APIからの応答にテキストデータが含まれていません。', data: null };
            } catch (error) {
                console.error('Error fetching or parsing grammar data:', error);
                return { status: 'fetch_error', message: error.message || '通信エラーが発生しました。', data: null };
            }
        }

        analyzeButton.addEventListener('click', async () => {
            const sentence = russianText.value.trim();
            if (!sentence) {
                analysisDisplay.innerHTML = '<p class="text-gray-500 text-center">分析する文章を入力してください。</p>';
                return;
            }

            analyzeButton.disabled = true;
            analyzeButton.textContent = '分析中...';
            analysisDisplay.innerHTML = `
                <div class="flex items-center justify-center space-x-2">
                    <svg class="animate-spin h-8 w-8 text-cyan-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="text-lg text-gray-400">Geminiで文法情報を検索しています...</span>
                </div>`;

            const result = await fetchSentenceAnalysis(sentence);

            if (result.status === 'success') {
                renderAnalysis(result.data);
            } else {
                const errorDetails = result.message || result.status;
                analysisDisplay.innerHTML = `<p class="text-red-400 text-center">分析に失敗しました。<br>エラー詳細: ${escapeHTML(errorDetails)}</p>`;
            }

            analyzeButton.disabled = false;
            analyzeButton.textContent = '分析する';
        });

        function renderAnalysis(analysisData) {
            analysisDisplay.innerHTML = '';
            const sentenceContainer = document.createElement('div');
            sentenceContainer.className = 'flex justify-center items-start flex-wrap gap-x-8 gap-y-4';

            const elements = analysisData.map((wordData, index) => {
                const container = document.createElement('div');
                container.className = 'flex flex-col items-center';
                container.dataset.id = index;
                if (wordData.relation && wordData.relation.target_index !== null) {
                    container.dataset.relationTargetId = wordData.relation.target_index;
                }

                const wordDisplay = document.createElement('div');
                wordDisplay.className = 'word-display text-center';
                wordDisplay.innerHTML = `
                    <div class="text-4xl font-bold text-cyan-300">${escapeHTML(wordData.word)}</div>
                    <div class="text-lg text-gray-400 mt-1">${escapeHTML(wordData.phonetic) || '&nbsp;'}</div>
                `;

                const connector = document.createElement('div');
                connector.className = 'my-2 h-6 w-0.5 bg-gray-600';

                const infoBox = document.createElement('div');
                const analysis = wordData.analysis;
                const pos = analysis.pos || "不明";
                const colorClass = posColors[pos] || posColors["不明"];
                infoBox.className = `bg-gray-800 text-left p-4 rounded-lg border-2 w-full sm:w-auto min-w-[220px] ${colorClass}`;

                let infoHTML = '';
                if (analysis.pos) infoHTML += createInfoLine("品詞", analysis.pos);
                if (analysis.base) infoHTML += createInfoLine("基本形", analysis.base);
                if (analysis.gender) infoHTML += createInfoLine("性", analysis.gender);
                if (analysis.case) infoHTML += createInfoLine("格", analysis.case);
                if (analysis.aspect) infoHTML += createInfoLine("アスペクト", analysis.aspect);
                if (analysis.tense) infoHTML += createInfoLine("時制", analysis.tense);
                if (analysis.person) infoHTML += createInfoLine("人称・数", analysis.person);
                if (analysis.case_change) infoHTML += createInfoLine("格変化", analysis.case_change, 'text-yellow-300');
                if (wordData.relation && wordData.relation.target_index !== null && analysisData[wordData.relation.target_index]) {
                    const targetWord = analysisData[wordData.relation.target_index].word;
                    infoHTML += createInfoLine("関連", `「${targetWord}」に${wordData.relation.type}`, 'text-teal-300');
                }
                if (analysis.note) infoHTML += createInfoLine("注釈", analysis.note, 'text-gray-300 italic');
                infoBox.innerHTML = infoHTML;

                container.append(wordDisplay, connector, infoBox);
                return container;
            });

            elements.forEach(el => {
                el.addEventListener('mouseover', handleMouseOver);
                el.addEventListener('mouseout', handleMouseOut);
                sentenceContainer.appendChild(el);
            });
            analysisDisplay.appendChild(sentenceContainer);
        }

        function handleMouseOver(event) {
            const currentTarget = event.currentTarget;
            const targetId = currentTarget.dataset.relationTargetId;

            currentTarget.querySelector('.word-display').classList.add('highlight-relation');

            if (targetId) {
                const targetElement = document.querySelector(`.flex-col[data-id='${targetId}']`);
                if (targetElement) {
                    targetElement.querySelector('.word-display').classList.add('highlight-relation');
                }
            }
        }

        function handleMouseOut() {
            document.querySelectorAll('.highlight-relation').forEach(el => {
                el.classList.remove('highlight-relation');
            });
        }

        function createInfoLine(label, value, valueClass = 'text-white') {
            return `<p class="text-sm"><strong class="font-semibold text-gray-400">${escapeHTML(label)}:</strong> <span class="${valueClass}">${escapeHTML(String(value))}</span></p>`;
        }

        russianText.value = "Красивая девушка читает интересную книгу.";
    </script>
</body>
</html>
