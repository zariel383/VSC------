    <!-- ポップアップ用モーダル -->
    <div id="imageModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <!-- <button class="close-btn" onclick="closeModal()">×</button> -->
            <img id="modalImage" src="" alt="Popup Image" onclick="toggleZoom()">
        </div>
    </div>

    <script>
        // タブ切り替え機能
        function switchTab(tabId, btnElement) {
            // すべてのセクションを非表示にする
            document.querySelectorAll('.gallery-section').forEach(section => {
                section.classList.remove('active');
            });
            // すべてのボタンの選択状態を解除する
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // 指定されたセクションを表示し、ボタンを選択状態にする
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
        }

        // 利用規約の表示切り替え機能
        function toggleTerms(termsId) {
            const content = document.getElementById(termsId);
            if (content.style.display === 'block') {
                content.style.display = 'none';
            } else {
                content.style.display = 'block';
            }
        }

        // 画像ポップアップ機能
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');

        // ギャラリー内の画像にクリックイベントを追加
        document.querySelectorAll('.gallery-item img').forEach(img => {
            img.addEventListener('click', function() {
                modal.classList.add('active');
                modalImg.src = this.src; // クリックされた画像のソースを設定
            });
        });

        // マウス移動時の処理（拡大時のみ表示領域を移動）
        const modalContent = document.querySelector('.modal-content');
        modalContent.addEventListener('mousemove', function(e) {
            if (!modalImg.classList.contains('enlarged')) return;

            // コンテンツ領域内でのマウス位置を取得
            const rect = modalContent.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 位置をパーセンテージに変換してtransform-originに適用
            const xPercent = (x / rect.width) * 100;
            const yPercent = (y / rect.height) * 100;

            modalImg.style.transformOrigin = `${xPercent}% ${yPercent}%`;
        });

        // 画像の拡大縮小を切り替える関数
        function toggleZoom() {
            modalImg.classList.toggle('enlarged');

            // 拡大解除時に位置を中央にリセット
            if (!modalImg.classList.contains('enlarged')) {
                modalImg.style.transformOrigin = 'center center';
            }
        }

        // モーダルを閉じる関数
        function closeModal() {
            modal.classList.remove('active');
            // 閉じる時に拡大状態をリセットする
            modalImg.classList.remove('enlarged');
            modalImg.style.transformOrigin = 'center center';
        }
    </script>
